<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catherine Financial Plan</title>
    <!-- 使用Inter字体，美观现代 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* 全局重置 & 颜色变量 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0b1b33;
            --text-secondary: #3c4b64;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-radius: 24px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --transition: 0.2s ease;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }
        /* 主卡片 */
        .card {
            max-width: 640px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2.2rem;
            transition: var(--transition);
        }
        /* 头像区域 */
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            font-weight: 600;
            color: white;
            margin-bottom: 1.2rem;
            user-select: none;
        }
        /* 标题与描述 */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .subhead {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 0.75rem;
        }
        .bio {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 1.8rem;
            max-width: 90%;
        }
        /* 社交链接 / 按钮组 */
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1rem;
            margin-bottom: 2rem;
        }
        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.4rem 0;
            border-bottom: 2px solid transparent;
            transition: border-color var(--transition), color var(--transition);
        }
        .links a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .links a i {
            font-size: 1.2rem;
        }
        /* 两个主要行动按钮 */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.7rem 1.6rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background var(--transition), transform var(--transition);
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1.5px solid #d1d9e6;
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(37, 99, 235, 0.04);
        }
        /* 页脚签名 */
        .footer {
            margin-top: 2.4rem;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #edf2f7;
            padding-top: 1.4rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .footer span {
            opacity: 0.8;
        }
        /* 简单响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 1.8rem 1.2rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .bio {
                max-width: 100%;
            }
            .actions .btn {
                flex: 1 1 100%;
                text-align: center;
            }
        }
        /* 模拟图标 (直接使用Unicode或简单字符，避免额外图标库) */
        .icon {
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像 -->
        <div class="avatar">🌱</div>

        <!-- 标题 -->
        <h1>Hi Everyone，I'm Catherine</h1>
        <div class="subhead">Your Financial Planner</div>

        <!-- 简介 -->
        <p class="bio">
            最近我希望帮助更多人，把自己的财务整理得更有方向、更安心。
            不知道你身边有没有朋友曾经说过：

•⁠  ⁠「我买了几份保险，但其实都不知道保些什么。」
•⁠  ⁠「钱一直放银行，不知道该怎么安排。」
•⁠  ⁠「不知道自己现在这样，以后退休够不够。」
•⁠  ⁠「想找个人帮我看看，现在的财务安排有没有什么遗漏。」
        </p>

        <!-- 社交媒体链接 (示例) -->
        <div class="links">
            <a href="#" target="_blank">
                <span class="icon">🐦</span> Twitter
            </a>
            <a href="#" target="_blank">
                <span class="icon">💻</span> GitHub
            </a>
            <a href="#" target="_blank">
                <span class="icon">📧</span> 邮箱
            </a>
            <a href="#" target="_blank">
                <span class="icon">📷</span> Instagram
            </a>
        </div>

        <!-- 主要操作按钮 -->
        <div class="actions">
            <a href="#" class="btn btn-primary">📄 查看作品</a>
            <a href="#" class="btn btn-outline">✉️ 联系我</a>
        </div>

        <!-- 底部信息 -->
        <div class="footer">
            <span>© 2026 · 基于 HTML/CSS 手工搭建</span>
            <span>🎯 保持简单</span>
        </div>
    </div>

    <!-- 简单JS交互：点击按钮提示（可选） -->
    <script>
        (function() {
            const btns = document.querySelectorAll('.btn');
            btns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // 如果链接是 # 占位，则阻止跳转并提示
                    if (this.getAttribute('href') === '#') {
                        e.preventDefault();
                        alert(Developing);
                    }
                });
            });
            // 社交链接如果也是 # ，同样阻止并提示
            document.querySelectorAll('.links a').forEach(link => {
                if (link.getAttribute('href') === '#') {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        alert(qun@yahoo.com);
                    });
                }
            });
        })();
    </script>
</body>
</html>
